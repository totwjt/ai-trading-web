# ============================================================
# 生产环境 Docker Compose —— 从 Harbor 拉取预构建镜像
# 
# 用法:
#   docker compose -f docker-compose.prod.yml --env-file .env.deploy up -d
# ============================================================

x-harbor: &harbor 192.168.66.26:8000/library

services:
  postgres:
    image: *harbor/postgres:15-alpine
    container_name: ai-trading-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wangjiangtao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-tushare_sync}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wangjiangtao} -d ${POSTGRES_DB:-tushare_sync}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: *harbor/ai-trading-backend:${IMAGE_TAG:-latest}
    container_name: ai-trading-backend
    env_file:
      - .env.deploy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8766:8766"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: *harbor/ai-trading-web:${IMAGE_TAG:-latest}
    container_name: ai-trading-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
