services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-trading-postgres
    environment:
      POSTGRES_USER: wangjiangtao
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: tushare_sync
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不暴露 5432 端口到宿主机，避免与宿主机原生 PostgreSQL 冲突
    # 其他容器通过 Docker 内部网络（服务名 postgres）访问
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wangjiangtao -d tushare_sync"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-trading-backend
    env_file:
      - .env.deploy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8766:8766"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web-client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/}
        VITE_WS_URL: ${VITE_WS_URL:-/}
    container_name: ai-trading-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
