</label>
<label class="flex items-center gap-3 cursor-pointer group">

<label class="flex items-center gap-3 cursor-pointer group">

</div>
</div>

<span class="material-symbols-outlined text-primary text-sm">check_circle</span>
</div>
<div class="flex items-center justify-between p-2 rounded hover:bg-surface-container-low transition-all cursor-pointer">

<span class="material-symbols-outlined text-outline-variant text-sm">circle</span>

<div class="flex items-center justify-between p-2 rounded hover:bg-surface-container-low transition-all cursor-pointer">

</div>

<tr class="hover:bg-surface-container-low transition-colors group">
